<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Scuba Trigger</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scuba Trigger">
<meta name="theme-color" content="#101114">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:#101114;
    color:#f2f2f2;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 20px 40px;
    padding-top:max(36px, env(safe-area-inset-top));
    padding-bottom:max(40px, env(safe-area-inset-bottom));
  }

  h1{
    font-size:20px;
    font-weight:600;
    margin:0 0 6px;
  }

  p.sub{
    font-size:13px;
    color:#9a9a9a;
    text-align:center;
    max-width:280px;
    margin:0 0 22px;
    line-height:1.5;
  }

  .cam-box{
    position:relative;
    width:min(62vw,220px);
    height:min(62vw,220px);
    border-radius:14px;
    overflow:hidden;
    background:#000;
    border:1px solid #2a2b2f;
    margin-bottom:18px;
  }

  video{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
  }

  #overlayCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    opacity:0.35;
  }

  #statusLine{
    font-size:13px;
    color:#b9b9b9;
    margin:0 0 18px;
    text-align:center;
    min-height:18px;
  }
  #statusLine.warn{ color:#f2a33c; }
  #statusLine.go{ color:#35d6c4; }

  .controls{
    width:min(80vw,260px);
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  button.primary{
    font-size:14px;
    font-weight:600;
    padding:13px 0;
    border-radius:9px;
    border:none;
    background:#35d6c4;
    color:#0a1a18;
    cursor:pointer;
  }
  button.primary:disabled{ opacity:0.6; }

  .sense-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    color:#9a9a9a;
  }

  input[type=range]{
    flex:1;
    -webkit-appearance:none;
    height:3px;
    background:#2a2b2f;
    border-radius:3px;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;
    border-radius:50%;
    background:#35d6c4;
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;
    border-radius:50%;
    background:#35d6c4;
    border:none;
    cursor:pointer;
  }

  .note{
    font-size:11px;
    color:#777;
    text-align:center;
    line-height:1.5;
  }
  .note.error{ color:#f2a33c; }

  .overlay{
    position:fixed;
    inset:0;
    background:#101114;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .overlay .emoji{ font-size:46px; margin-bottom:8px; }
  .overlay h2{ font-size:20px; margin:0 0 6px; }
  .overlay p{ font-size:13px; color:#9a9a9a; margin:0 0 22px; }

  a.watch-btn{
    display:inline-block;
    font-size:14px;
    font-weight:600;
    padding:13px 26px;
    border-radius:9px;
    background:#35d6c4;
    color:#0a1a18;
    text-decoration:none;
    margin-bottom:12px;
  }

  button.ghost{
    background:none;
    border:none;
    color:#9a9a9a;
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
  }
</style>
</head>
<body>

  <h1>Scuba Trigger</h1>
  <p class="sub">Do the scuba wave in front of the camera to open the video.</p>

  <div class="cam-box">
    <div class="placeholder" id="placeholderIcon">🤿</div>
    <video id="video" playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <p id="statusLine">Tap Begin to start</p>

  <div class="controls">
    <button class="primary" id="startBtn">Begin</button>
    <div class="sense-row">
      <span>Sensitivity</span>
      <input type="range" id="senseSlider" min="3" max="18" value="9" step="1">
    </div>
    <p class="note" id="noteText">Uses your front camera only — nothing is recorded or sent anywhere.</p>
  </div>

<div class="overlay" id="overlay">
  <div class="emoji">🤿</div>
  <h2>Surfaced.</h2>
  <p>Scuba wave detected — here's your video.</p>
  <a class="watch-btn" id="watchBtn" href="https://youtube.com/shorts/TBxXCyeN09E?si=TwqM9vE_nL_PCETR" target="_blank" rel="noopener">Open Video</a>
  <br>
  <button class="ghost" id="diveAgainBtn">Dive again</button>
</div>

<script>
(function(){
  const video = document.getElementById('video');
  const overlayCanvas = document.getElementById('overlayCanvas');
  const ctx = overlayCanvas.getContext('2d');

  const startBtn = document.getElementById('startBtn');
  const senseSlider = document.getElementById('senseSlider');
  const statusLine = document.getElementById('statusLine');
  const overlay = document.getElementById('overlay');
  const placeholderIcon = document.getElementById('placeholderIcon');
  const noteText = document.getElementById('noteText');
  const diveAgainBtn = document.getElementById('diveAgainBtn');
  const watchBtn = document.getElementById('watchBtn');
  const VIDEO_URL = watchBtn.href;

  let running = false;
  let triggered = false;
  let prevX = null;
  let lastDir = null;
  let swingEvents = [];
  let lastHandTime = 0;

  const WINDOW_MS = 2200;
  const REQUIRED_SWINGS = 3;
  const HAND_GRACE_MS = 900;
  const DEAD = 0.012;

  function getThreshold(){
    const v = Number(senseSlider.value);
    return 0.13 - ((v - 3) / 15) * 0.10;
  }

  function setStatus(text, mode){
    statusLine.textContent = text;
    statusLine.classList.remove('warn','go');
    if (mode) statusLine.classList.add(mode);
  }

  let hands;

  function onResults(results){
    const cw = overlayCanvas.width, ch = overlayCanvas.height;
    ctx.save();
    ctx.clearRect(0,0,cw,ch);
    ctx.translate(cw,0);
    ctx.scale(-1,1);
    ctx.drawImage(results.image, 0, 0, cw, ch);

    let handCount = 0;
    if (results.multiHandLandmarks && results.multiHandLandmarks.length){
      handCount = results.multiHandLandmarks.length;
      results.multiHandLandmarks.forEach(lm => {
        if (window.drawConnectors && window.HAND_CONNECTIONS){
          window.drawConnectors(ctx, lm, window.HAND_CONNECTIONS, {color:'rgba(53,214,196,0.85)', lineWidth:2});
        }
        if (window.drawLandmarks){
          window.drawLandmarks(ctx, lm, {color:'#f2a33c', radius:3, lineWidth:0});
        }
      });
    }
    ctx.restore();

    const now = performance.now();
    let dx = 0;
    if (handCount > 0){
      lastHandTime = now;
      const x = results.multiHandLandmarks[0][0].x;
      if (prevX !== null) dx = x - prevX;
      prevX = x;
    } else {
      prevX = null;
    }

    processMotion(dx, now);
  }

  function processMotion(dx, now){
    const threshold = getThreshold();

    if (now - lastHandTime > HAND_GRACE_MS){
      swingEvents = [];
      lastDir = null;
      if (!triggered) setStatus('Show your hand');
      return;
    }

    let dominant = null;
    if (Math.abs(dx) > threshold){
      dominant = dx > 0 ? 'R' : 'L';
    }
    if (dominant && dominant !== lastDir){
      swingEvents.push(now);
      lastDir = dominant;
    }
    swingEvents = swingEvents.filter(t => now - t < WINDOW_MS);

    if (triggered) return;

    if (swingEvents.length === 0){
      setStatus('Hand seen — start waving');
    } else {
      setStatus(`Swing ${swingEvents.length} of ${REQUIRED_SWINGS}`, 'warn');
    }

    if (swingEvents.length >= REQUIRED_SWINGS){
      triggerDetected();
    }
  }

  function triggerDetected(){
    triggered = true;
    setStatus('Scuba detected!', 'go');
    setTimeout(() => {
      overlay.classList.add('show');
      try { window.open(VIDEO_URL, '_blank', 'noopener'); } catch(e){}
    }, 350);
  }

  function resetDetection(){
    triggered = false;
    swingEvents = [];
    lastDir = null;
    prevX = null;
    overlay.classList.remove('show');
    setStatus('Watching for the wave');
  }

  async function startCamera(){
    setStatus('Requesting camera…');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 480 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      await new Promise(resolve => {
        if (video.readyState >= 2) return resolve();
        video.onloadedmetadata = () => resolve();
      });
      overlayCanvas.width = video.videoWidth || 480;
      overlayCanvas.height = video.videoHeight || 480;

      placeholderIcon.style.display = 'none';
      startBtn.textContent = 'Watching…';
      startBtn.disabled = true;
      running = true;

      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5
      });
      hands.onResults(onResults);

      setStatus('Watching for the wave');
      loop();
    } catch (err) {
      setStatus('Camera unavailable', 'warn');
      noteText.textContent = "Camera access failed. Open this page directly in Safari and allow camera access.";
      noteText.classList.add('error');
    }
  }

  async function loop(){
    if (!running) return;
    if (video.readyState >= 2 && hands){
      await hands.send({ image: video });
    }
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startCamera);
  diveAgainBtn.addEventListener('click', resetDetection);
})();
</script>

</body>
</html>
