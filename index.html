<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Scuba Trigger</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scuba Trigger">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 20px 40px;
    padding-top:max(36px, env(safe-area-inset-top));
    padding-bottom:max(40px, env(safe-area-inset-bottom));
  }

  h1{
    font-size:16px;
    font-weight:500;
    margin:0 0 20px;
    color:#fff;
  }

  .cam-box{
    position:relative;
    width:min(62vw,220px);
    height:min(62vw,220px);
    border-radius:10px;
    overflow:hidden;
    background:#000;
    border:1px solid #2a2a2a;
    margin-bottom:18px;
  }

  video{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
  }

  #overlayCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  #statusLine{
    font-size:13px;
    color:#aaa;
    margin:0 0 18px;
    text-align:center;
    min-height:18px;
  }
  #statusLine.go{ color:#fff; }

  .controls{
    width:min(80vw,260px);
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  button.primary{
    font-size:14px;
    font-weight:500;
    padding:13px 0;
    border-radius:6px;
    border:1px solid #fff;
    background:#000;
    color:#fff;
    cursor:pointer;
  }
  button.primary:disabled{ opacity:0.5; }

  .sense-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    color:#777;
  }

  input[type=range]{
    flex:1;
    -webkit-appearance:none;
    height:2px;
    background:#2a2a2a;
    border-radius:2px;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;height:14px;
    border-radius:50%;
    background:#fff;
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;
    border-radius:50%;
    background:#fff;
    border:none;
    cursor:pointer;
  }

  .note{
    font-size:11px;
    color:#555;
    text-align:center;
    line-height:1.5;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .video-box{
    width:min(78vw,280px);
    aspect-ratio:9/16;
    background:#000;
    border-radius:8px;
    overflow:hidden;
    margin-bottom:18px;
  }
  .video-box iframe{
    width:100%;
    height:100%;
    border:0;
  }

  button.ghost{
    background:none;
    border:none;
    color:#777;
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
  }
</style>
</head>
<body>

  <h1>Scuba Trigger</h1>

  <div class="cam-box">
    <video id="video" playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <p id="statusLine">Tap Begin to start</p>

  <div class="controls">
    <button class="primary" id="startBtn">Begin</button>
    <div class="sense-row">
      <span>Sensitivity</span>
      <input type="range" id="senseSlider" min="3" max="18" value="9" step="1">
    </div>
    <p class="note" id="noteText">Uses your camera only — nothing is recorded or sent anywhere.</p>
  </div>

<div class="overlay" id="overlay">
  <div class="video-box">
    <iframe id="ytFrame" src="" title="video" frameborder="0"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      allowfullscreen></iframe>
  </div>
  <button class="ghost" id="diveAgainBtn">Reset</button>
</div>

<script>
(function(){
  const video = document.getElementById('video');
  const overlayCanvas = document.getElementById('overlayCanvas');
  const ctx = overlayCanvas.getContext('2d');

  const startBtn = document.getElementById('startBtn');
  const senseSlider = document.getElementById('senseSlider');
  const statusLine = document.getElementById('statusLine');
  const overlay = document.getElementById('overlay');
  const noteText = document.getElementById('noteText');
  const diveAgainBtn = document.getElementById('diveAgainBtn');
  const ytFrame = document.getElementById('ytFrame');
  const VIDEO_ID = 'TBxXCyeN09E';
  const EMBED_URL = `https://www.youtube.com/embed/${VIDEO_ID}?playsinline=1&rel=0&modestbranding=1&enablejsapi=1`;

  let running = false;
  let triggered = false;
  let prevX = null;
  let lastDir = null;
  let swingEvents = [];
  let lastHandTime = 0;

  const WINDOW_MS = 2200;
  const REQUIRED_SWINGS = 3;
  const HAND_GRACE_MS = 900;
  const DEAD = 0.012;

  function getThreshold(){
    const v = Number(senseSlider.value);
    return 0.13 - ((v - 3) / 15) * 0.10;
  }

  function setStatus(text, mode){
    statusLine.textContent = text;
    statusLine.classList.remove('go');
    if (mode) statusLine.classList.add(mode);
  }

  let hands;

  function onResults(results){
    const cw = overlayCanvas.width, ch = overlayCanvas.height;
    ctx.save();
    ctx.clearRect(0,0,cw,ch);
    ctx.translate(cw,0);
    ctx.scale(-1,1);
    ctx.drawImage(results.image, 0, 0, cw, ch);

    let handCount = 0;
    if (results.multiHandLandmarks && results.multiHandLandmarks.length){
      handCount = results.multiHandLandmarks.length;
      results.multiHandLandmarks.forEach(lm => {
        if (window.drawConnectors && window.HAND_CONNECTIONS){
          window.drawConnectors(ctx, lm, window.HAND_CONNECTIONS, {color:'rgba(255,255,255,0.7)', lineWidth:2});
        }
        if (window.drawLandmarks){
          window.drawLandmarks(ctx, lm, {color:'#ffffff', radius:3, lineWidth:0});
        }
      });
    }
    ctx.restore();

    const now = performance.now();
    let dx = 0;
    if (handCount > 0){
      lastHandTime = now;
      const x = results.multiHandLandmarks[0][0].x;
      if (prevX !== null) dx = x - prevX;
      prevX = x;
    } else {
      prevX = null;
    }

    processMotion(dx, now);
  }

  function processMotion(dx, now){
    const threshold = getThreshold();

    if (now - lastHandTime > HAND_GRACE_MS){
      swingEvents = [];
      lastDir = null;
      if (!triggered) setStatus('Show your hand');
      return;
    }

    let dominant = null;
    if (Math.abs(dx) > threshold){
      dominant = dx > 0 ? 'R' : 'L';
    }
    if (dominant && dominant !== lastDir){
      swingEvents.push(now);
      lastDir = dominant;
    }
    swingEvents = swingEvents.filter(t => now - t < WINDOW_MS);

    if (triggered) return;

    if (swingEvents.length === 0){
      setStatus('Hand seen — start waving');
    } else {
      setStatus(`Swing ${swingEvents.length} of ${REQUIRED_SWINGS}`);
    }

    if (swingEvents.length >= REQUIRED_SWINGS){
      triggerDetected();
    }
  }

  function triggerDetected(){
    triggered = true;
    setStatus('Detected', 'go');
    overlay.classList.add('show');
    try {
      ytFrame.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    } catch(e){}
  }

  function resetDetection(){
    triggered = false;
    swingEvents = [];
    lastDir = null;
    prevX = null;
    try {
      ytFrame.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    } catch(e){}
    overlay.classList.remove('show');
    setStatus('Watching for the wave');
  }

  async function startCamera(){
    setStatus('Requesting camera…');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 480 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      await new Promise(resolve => {
        if (video.readyState >= 2) return resolve();
        video.onloadedmetadata = () => resolve();
      });
      overlayCanvas.width = video.videoWidth || 480;
      overlayCanvas.height = video.videoHeight || 480;

      startBtn.textContent = 'Watching…';
      startBtn.disabled = true;
      running = true;
      ytFrame.src = EMBED_URL;

      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5
      });
      hands.onResults(onResults);

      setStatus('Watching for the wave');
      loop();
    } catch (err) {
      setStatus('Camera unavailable');
      noteText.textContent = "Camera access failed. Open this page directly in Safari and allow camera access.";
    }
  }

  async function loop(){
    if (!running) return;
    if (video.readyState >= 2 && hands){
      await hands.send({ image: video });
    }
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startCamera);
  diveAgainBtn.addEventListener('click', resetDetection);
})();
</script>

</body>
</html>
